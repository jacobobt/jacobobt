<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Jacobo Barrera Toba — Junior Software Developer</title>
  <desc id="desc">Personal GitHub banner with dark indigo gradient, subtle geometric accents and Java Spring Boot Angular stack.</desc>
  <defs>
